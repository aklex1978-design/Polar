name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Системні бібліотеки для Qt без дисплея
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core
      - name: Встановлення
        run: |
          python -m pip install -e "polar_core[test]" -e ros2_ws/src/pantilt_driver -e "polar_app[gui,test]"
      - name: polar_core
        run: python -m pytest polar_core
      - name: pantilt_driver (логіка без ROS)
        run: python -m pytest ros2_ws/src/pantilt_driver/test
      - name: polar_app (сервіси, відео й екрани з імітатором)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest polar_app/tests
      - name: Знімки екранів
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tools/screenshot_control.py shots
          for f in shots/usb_dialog.png shots/camera_form_usb.png; do echo "PNG_BEGIN $f"; base64 -w0 "$f"; echo; echo "PNG_END"; done
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/*.png

  ros2:
    runs-on: ubuntu-22.04
    container: ros:humble
    steps:
      - uses: actions/checkout@v4
      - name: Залежності
        run: |
          apt-get update && apt-get install -y python3-serial python3-pytest python3-pip python3-numpy
          python3 -m pip install -U pip
          python3 -m pip install --no-deps -e polar_core -e polar_app
      - name: colcon build
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          cd ros2_ws
          colcon build --event-handlers console_direct+
      - name: Запуск імітатора через launch
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source ros2_ws/install/setup.bash
          ros2 launch pantilt_driver pantilt.launch.py backend:=sim camera:=ci &
          sleep 8
          ros2 topic pub --once /polar/ci/cmd polar_interfaces/msg/PanTiltCommand "{azimuth_deg: 45.0, elevation_deg: 20.0, speed_deg_s: 90.0}"
          sleep 2
          timeout 10 ros2 topic echo --once /polar/ci/state > state.txt
          cat state.txt
          grep -q "azimuth_deg: 45" state.txt
          ros2 service call /polar/ci/scan polar_interfaces/srv/ScanServos "{first_id: 1, last_id: 5}" | tee scan.txt
          grep -q "ids" scan.txt
          kill %1
      - name: Наскрізний тест polar_control ↔ pantilt_driver
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source ros2_ws/install/setup.bash
          python3 -m pytest -v polar_app/tests_ros
