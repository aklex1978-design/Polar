[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "polar-core"
version = "0.1.0"
description = "Polar: ядро — кути, панорама, база даних, імітатор камери"
requires-python = ">=3.10"
dependencies = ["numpy>=1.21", "opencv-python-headless>=4.6", "cryptography>=3.4", "Pillow>=9",
                "pygrabber>=0.2; sys_platform == 'win32'"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
